<!doctype html>
<html lang="en" class="initial-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7fbfa" />
    <style>html.initial-loading,html.initial-loading body,html.initial-loading #root{background:#06131a}</style>
    <script>
      (function () {
        var loaderFailSafe = window.setTimeout(function () {
          document.documentElement.classList.remove('initial-loading')
          if (document.body) document.body.removeAttribute('aria-busy')
          var loader = document.querySelector('.initial-loader')
          if (loader) {
            loader.style.display = 'none'
            loader.style.pointerEvents = 'none'
          }
        }, 6000)

        window.addEventListener('nourdoc:ready', function () {
          window.clearTimeout(loaderFailSafe)
        }, { once: true })
      }())
    </script>
    <link rel="icon" href="/favicon.ico" />
    <script>
      if (location.pathname === '/' || location.pathname === '/index.html') {
        const heroPreload = document.createElement('link')
        heroPreload.rel = 'preload'
        heroPreload.as = 'image'
        heroPreload.type = 'image/webp'
        heroPreload.href = '/images/01-home-clinical-conversation-1600.webp'
        heroPreload.imageSrcset = '/images/01-home-clinical-conversation-480.webp 480w, /images/01-home-clinical-conversation-960.webp 960w, /images/01-home-clinical-conversation-1600.webp 1600w'
        heroPreload.imageSizes = '100vw'
        heroPreload.fetchPriority = 'high'
        document.head.append(heroPreload)
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>NourDoc — Ambient Clinical Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
